name: Validate provisioning
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y shellcheck openssh-server
      - name: Shell and safety tests
        run: bash tests/check.sh
      - name: Parse generated SSH policy with OpenSSH
        run: |
          python3 - <<'PY' > /tmp/elektrokube-sshd.conf
          import sys
          sys.path.insert(0, 'lib')
          from ssh_access import ssh_config
          print(ssh_config('root', '192.168.2.153', 2222))
          PY
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A
          sudo /usr/sbin/sshd -t -f /tmp/elektrokube-sshd.conf
          sudo /usr/sbin/sshd -T -f /tmp/elektrokube-sshd.conf -C user=root,host=node,addr=192.168.2.153 > /tmp/effective.conf
          grep -qx 'passwordauthentication no' /tmp/effective.conf
          grep -qx 'kbdinteractiveauthentication no' /tmp/effective.conf
          grep -qx 'authenticationmethods publickey' /tmp/effective.conf
          grep -qx 'allowusers root@192.168.2.153' /tmp/effective.conf
      - name: Parse temporary root enrollment policy
        run: |
          cat > /tmp/elektrokube-enrollment.conf <<'EOF'
          # elektrokube: temporary root enrollment
          PermitRootLogin yes
          PasswordAuthentication yes
          PubkeyAuthentication yes
          AuthenticationMethods any
          AllowUsers root@192.168.2.153
          EOF
          cat > /tmp/elektrokube-bootstrap-sshd.conf <<'EOF'
          Include /tmp/elektrokube-enrollment.conf
          PermitRootLogin prohibit-password
          PasswordAuthentication no
          UsePAM yes
          EOF
          sudo /usr/sbin/sshd -t -f /tmp/elektrokube-bootstrap-sshd.conf
          sudo /usr/sbin/sshd -T -f /tmp/elektrokube-bootstrap-sshd.conf -C user=root,host=first-node,addr=192.168.2.153 > /tmp/bootstrap-effective.conf
          grep -qx 'permitrootlogin yes' /tmp/bootstrap-effective.conf
          grep -qx 'passwordauthentication yes' /tmp/bootstrap-effective.conf
          grep -qx 'pubkeyauthentication yes' /tmp/bootstrap-effective.conf
          grep -qx 'authenticationmethods any' /tmp/bootstrap-effective.conf
          grep -qx 'allowusers root@192.168.2.153' /tmp/bootstrap-effective.conf
